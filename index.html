<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Location on Google Map</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    #map-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      max-width: 100%;
      margin: 20px auto;
    }

    #map-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #info {
      margin-top: 10px;
      color: #333;
    }
  </style>
</head>
<body>

  <h2>Your Current Location</h2>
  <div id="map-container"></div>
  <div id="info"></div>

  <script>
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        position => {
          const { latitude, longitude, accuracy } = position.coords;

          console.log("Latitude:", latitude);
          console.log("Longitude:", longitude);
          console.log("Accuracy (meters):", accuracy);

          document.getElementById('map-container').innerHTML = `
            <iframe
              src="https://maps.google.com/maps?q=${latitude},${longitude}&z=15&output=embed"
              allowfullscreen
              loading="lazy"
              title="Google Map">
            </iframe>`;

          document.getElementById('info').innerText = 
            `Latitude: ${latitude.toFixed(5)}, Longitude: ${longitude.toFixed(5)} (±${Math.round(accuracy)} meters)`;
        },
        error => {
          console.error("Geolocation Error:", error);
          document.getElementById('info').innerText = "Location access denied or unavailable.";
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    } else {
      document.getElementById('info').innerText = "Geolocation is not supported by your browser.";
    }
  </script>

</body>
</html>
