<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAY HELLO</title>
    <style>
        body {
          font-family: sans-serif;
          margin: 0;
          padding: 0;
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100vw;
          height: 100vh;
        }
    
        #map{
          position: relative;
          padding-bottom: 56.25%; /* 16:9 aspect ratio */
          height: 0;
          overflow: hidden;
          max-width: 100%;
          margin: 20px auto;
        }
    
        #map iframe {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: 0;
        }
      </style>
</head>

<body>
    <div id="map">
    </div>

    <script>
        navigator.geolocation.getCurrentPosition(position => {
            const { latitude, longitude } = position.coords;
            console.log(latitude,longitude);
            
            document.getElementById('map').innerHTML = '<iframe src="https://maps.google.com/maps?q=' + latitude + ',' + longitude + '&amp;z=15&amp;output=embed" width="600" height="450" style="border:0;" loading="lazy" title="Google Map"></iframe>';
        },
        error => {
            console.error("Geolocation error:", error.message);
            alert("Unable to retrieve location: " + error.message);
        });

    </script>
</body>

</html>
